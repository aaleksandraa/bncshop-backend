; Laravel schedule:work for BNC Shop (replaces cron schedule:run)
; Copy to /etc/supervisor/conf.d/bncshop-scheduler.conf
;
; After enabling, REMOVE Plesk cron task for artisan schedule:run.
;
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start bncshop-scheduler

[program:bncshop-scheduler]
process_name=%(program_name)s
directory=/var/www/vhosts/bncshop.ba/api.bncshop.ba
command=/opt/plesk/php/8.3/bin/php artisan schedule:work
autostart=true
autorestart=true
user=bncshop.ba_itus4zie2k
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/vhosts/bncshop.ba/logs/scheduler-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
environment=HOME="/var/www/vhosts/bncshop.ba",APP_ENV="production"
