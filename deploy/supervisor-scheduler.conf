; Laravel schedule:work for BNC Shop (replaces cron schedule:run)
; Copy to /etc/supervisor/conf.d/bncshop-scheduler.conf
;
; Production Laravel root is api.bnc.ba, not the legacy bncshop.ba vhost.
;
;   sudo cp deploy/supervisor-scheduler.conf /etc/supervisor/conf.d/bncshop-scheduler.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start bncshop-scheduler
;
; Do not also keep a Plesk cron that calls schedule:run.

[program:bncshop-scheduler]
process_name=%(program_name)s
directory=/var/www/vhosts/bnc.ba/api.bnc.ba
command=/opt/plesk/php/8.3/bin/php /var/www/vhosts/bnc.ba/api.bnc.ba/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=bnc.ba_cr5ub3id92
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/vhosts/bnc.ba/logs/scheduler-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
environment=HOME="/var/www/vhosts/bnc.ba",APP_ENV="production"
