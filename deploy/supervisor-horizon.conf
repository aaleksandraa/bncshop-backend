; Laravel Horizon for BNC Webshop
; Copy to /etc/supervisor/conf.d/bncshop-horizon.conf and adjust paths.
;
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start bncshop-horizon

[program:bncshop-horizon]
process_name=%(program_name)s
directory=/var/www/vhosts/DOMAIN/bncshop-backend
command=/opt/plesk/php/8.3/bin/php artisan horizon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=plesk-user
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/bncshop-horizon.log
stopwaitsecs=3600
