; Laravel Horizon for BNC Webshop (Plesk production template)
; Copy to /etc/supervisor/conf.d/bncshop-horizon.conf and adjust DOMAIN / user.
;
;   sudo mkdir -p /var/www/vhosts/DOMAIN/logs
;   sudo chown plesk-user:psacln /var/www/vhosts/DOMAIN/logs
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start bncshop-horizon
;
; Do NOT use pkill in command= — it can kill the wrapper bash and cause BACKOFF.
; Do NOT enable deploy/systemd-horizon.service alongside this program.

[program:bncshop-horizon]
process_name=%(program_name)s
directory=/var/www/vhosts/DOMAIN/api.bncshop.ba
command=/opt/plesk/php/8.3/bin/php /var/www/vhosts/DOMAIN/api.bncshop.ba/artisan horizon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=plesk-user
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/vhosts/DOMAIN/logs/horizon-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
environment=HOME="/var/www/vhosts/DOMAIN",APP_ENV="production"
